services:
  - type: web
    name: whatsapp-agent-gateway
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd ../gateway && npm install
    startCommand: cd gateway && node server.mjs
    envVars:
      - key: BACKEND_WEBHOOK_URL
        value: https://whatsapp-agent-bay.vercel.app/webhook
      - key: BACKEND_API_URL
        value: https://whatsapp-agent-bay.vercel.app
      - key: GATEWAY_TOKEN
        value: mysecrettoken123
      - key: GATEWAY_PORT
        value: 3001
      - key: WWEBJS_AUTH_PATH
        value: /tmp/.wwebjs_auth
